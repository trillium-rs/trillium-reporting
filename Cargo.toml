[package]
name = "trillium-reporting"
version = "0.1.0"
edition = "2024"
description = "Reporting API (Reporting-Endpoints header + report collection endpoint) for the trillium.rs web framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trillium-rs/trillium-reporting"
readme = "README.md"
keywords = ["trillium", "reporting", "csp", "security", "middleware"]
categories = ["web-programming", "web-programming::http-server"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trillium = "1"

[dev-dependencies]
trillium-testing = "0.10"

